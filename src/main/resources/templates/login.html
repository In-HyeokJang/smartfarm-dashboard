<!DOCTYPE html>
<!--
  login.html
  Spring Security 커스텀 로그인 페이지.
  SecurityConfig에서 .loginPage("/login")으로 지정된 페이지입니다.

  중요 포인트:
  - th:action="@{/login}": Spring Security가 처리하는 POST /login URL
  - th:if="${param.error}": 로그인 실패 시 ?error 파라미터로 에러 메시지 표시
  - th:if="${param.logout}": 로그아웃 완료 시 ?logout 파라미터로 안내 메시지 표시
  - CSRF 토큰은 Thymeleaf가 th:action 사용 시 자동으로 hidden input으로 삽입함
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFarm 로그인</title>
    <!-- Bootstrap 5.3 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a4a1a 0%, #2d7a2d 50%, #1a4a1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .login-header {
            background: linear-gradient(135deg, #2d7a2d, #52b852);
            border-radius: 20px 20px 0 0;
            padding: 2rem;
            text-align: center;
            color: white;
        }
        .farm-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        .btn-login {
            background: linear-gradient(135deg, #2d7a2d, #52b852);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #245e24, #449944);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(45,122,45,0.4);
        }
        .form-control:focus {
            border-color: #52b852;
            box-shadow: 0 0 0 0.25rem rgba(82,184,82,0.25);
        }
        .input-group-text {
            background-color: #f0f7f0;
            border-color: #dee2e6;
            color: #2d7a2d;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card login-card">
                <!-- 헤더 -->
                <div class="login-header">
                    <div class="farm-icon">🌿</div>
                    <h4 class="mb-1 fw-bold">SmartFarm Dashboard</h4>
                    <p class="mb-0 opacity-75 small">관리자 전용 시스템</p>
                </div>

                <!-- 로그인 폼 -->
                <div class="card-body p-4">

                    <!-- 로그인 실패 알림 -->
                    <div class="alert alert-danger d-flex align-items-center py-2" th:if="${param.error}">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span>아이디 또는 비밀번호가 올바르지 않습니다.</span>
                    </div>

                    <!-- 로그아웃 완료 알림 -->
                    <div class="alert alert-success d-flex align-items-center py-2" th:if="${param.logout}">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span>로그아웃 되었습니다.</span>
                    </div>

                    <!--
                        th:action="@{/login}": Spring Security가 POST /login을 받아 인증 처리
                        Thymeleaf가 자동으로 CSRF hidden input을 삽입해 줌
                    -->
                    <form th:action="@{/login}" method="post">
                        <!-- 아이디 입력 -->
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold text-secondary small">관리자 아이디</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-person-fill"></i>
                                </span>
                                <input type="text"
                                       id="username"
                                       name="username"
                                       class="form-control"
                                       placeholder="아이디 입력"
                                       required
                                       autofocus>
                            </div>
                        </div>

                        <!-- 비밀번호 입력 -->
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold text-secondary small">비밀번호</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-lock-fill"></i>
                                </span>
                                <input type="password"
                                       id="password"
                                       name="password"
                                       class="form-control"
                                       placeholder="비밀번호 입력"
                                       required>
                            </div>
                        </div>

                        <!-- 로그인 버튼 -->
                        <button type="submit" class="btn btn-login btn-success w-100 text-white">
                            <i class="bi bi-box-arrow-in-right me-2"></i>로그인
                        </button>
                    </form>
                </div>
            </div>

            <!-- 하단 안내 -->
            <p class="text-center text-white-50 small mt-3">
                <i class="bi bi-shield-lock me-1"></i>
                관리자만 접근 가능한 시스템입니다
            </p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
